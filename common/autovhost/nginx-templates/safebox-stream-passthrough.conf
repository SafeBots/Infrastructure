# /etc/nginx/stream.d/safebox-stream-passthrough.conf
#
# nginx stream {} block for TLS passthrough mode. Installed alongside
# safebox-autovhost.conf when SAFEBOX_TLS_MODE=passthrough.
#
# How it works:
#   1. nginx reads the SNI hostname from the TLS ClientHello (ssl_preread)
#   2. Looks up the backend in the $sni_backend map
#   3. Proxies the raw TCP stream to the tenant container — no decryption
#   4. The tenant container terminates TLS with its own cert and key
#
# The map is populated by autovhost when it provisions a new host in
# passthrough mode. Each entry maps a hostname to the tenant container's
# internal IP:port. The map file lives on the encrypted ZFS pool at
# /var/lib/safebox/nginx/stream-map.conf and is included below.
#
# nginx never holds the TLS private key. It never sees plaintext traffic.
# An RCE in nginx gives the attacker encrypted bytes they cannot read.

map $ssl_preread_server_name $sni_backend {
    # Default: drop unknown hostnames (nginx closes the connection).
    default "";

    # Per-host entries written by autovhost at provisioning time:
    #   app.example.com  10.0.1.5:8443;
    #   other.com        10.0.1.6:8443;
    include /var/lib/safebox/nginx/stream-map.conf;
}

server {
    listen 443;
    ssl_preread on;

    # If the SNI hostname isn't in the map, $sni_backend is empty and
    # proxy_pass fails, closing the connection. This is the correct
    # behavior: unknown hostnames get dropped, not proxied anywhere.
    proxy_pass $sni_backend;

    # Timeouts: match the tenant app's TLS handshake and keep-alive.
    proxy_connect_timeout 10s;
    proxy_timeout 600s;
}
