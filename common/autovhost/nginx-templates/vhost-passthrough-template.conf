# nginx-templates/vhost-passthrough-template.conf
#
# TLS passthrough template for per-host nginx vhosts on Safebox instances.
# Unlike vhost-template.conf (which terminates TLS in nginx), this template
# routes encrypted TCP streams directly to the tenant container, which holds
# the TLS private key and terminates TLS itself.
#
# Security advantage: nginx never holds the TLS private key. An RCE in nginx
# gives the attacker a TCP relay position (denial of service) but NOT the
# ability to decrypt, inspect, modify, or forge traffic. The key is inside
# the tenant's gVisor container, on the tenant's ZFS dataset, sealed to the
# TPM.
#
# Trade-off: nginx cannot inspect HTTP headers, set security headers, rate
# limit, buffer requests, or serve static files — it sees only encrypted
# bytes. The tenant app (e.g. the Qbix webserver) handles all HTTP-level
# concerns.
#
# This template is used when the Safebox is configured with
# SAFEBOX_TLS_MODE=passthrough (see docs/TLS-PASSTHROUGH.md). The default
# mode remains "terminate" (vhost-template.conf) for backward compatibility.
#
# Available placeholders:
#   {{hostname}}            — customer hostname (e.g. "app.example.com")
#   {{backendAddress}}      — tenant container IP:port for TLS passthrough
#   {{acmeChallengesRoot}}  — shared ACME tokens dir (for cert renewal)
#
# NOTE: This template produces a `stream {}` server block, not an `http {}`
# server block. autovhost writes it to a separate include directory
# (/var/lib/safebox/nginx/stream-vhosts/) which nginx includes inside its
# stream {} context. The SNI map entry is also written by autovhost.

# HTTP server for this host — handles ACME challenges for cert renewal
# and redirects everything else to HTTPS. This remains in the http {}
# context because ACME HTTP-01 validation must happen over plaintext HTTP.
server {
    listen 80;
    server_name {{hostname}};

    location /.well-known/acme-challenge/ {
        root {{acmeChallengesRoot}};
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
