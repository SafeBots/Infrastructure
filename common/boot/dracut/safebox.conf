# /etc/dracut.conf.d/safebox.conf
# Pull the safebox unseal step, systemd's verity root opener, and ZFS into
# every initramfs built on this image. hostonly is off so the initramfs is
# identical regardless of the build host's hardware; the same bytes are
# measured into PCR 9 on every instance.
add_dracutmodules+=" safebox systemd-veritysetup zfs "
hostonly="no"
compress="xz"
