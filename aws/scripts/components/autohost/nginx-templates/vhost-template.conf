# nginx-templates/vhost-template.conf
#
# Template for per-host nginx vhosts on Safebox instances. autohost reads
# this file at startup and substitutes the {{placeholders}} below at
# provisioning time to produce /etc/nginx/conf.d/auto/<hostname>.conf.
#
# Operators: edit this file freely to customize what generated per-host
# vhosts look like. Restart safebox-autohost after editing so it reloads
# the template. New provisioning runs will use the new template; previously
# provisioned vhosts stay as-is until they're regenerated.
#
# Installed by install-autohost.sh at:
#   /etc/safebox/autohost-vhost-template.conf
#
# Available placeholders:
#   {{hostname}}            — customer hostname (e.g. "app.example.com")
#   {{certPath}}            — full path to per-host cert file
#   {{keyPath}}             — full path to per-host key file
#   {{proxyTarget}}         — upstream from config.proxyTarget
#   {{acmeChallengesRoot}}  — shared ACME tokens dir (for renewal validation)
#
# Multiple occurrences of the same placeholder are all replaced. Unknown
# {{xxx}} tokens are left alone, so nginx $variables like ${request_uri}
# pass through unaltered.
#
# Common customizations:
#
#   Per-hostname static files with proxy fallback:
#       root /var/www/{{hostname}};
#       try_files $uri @app;
#       location @app { proxy_pass http://{{proxyTarget}}; }
#
#   Different upstreams per path:
#       location /api/ { proxy_pass http://api-backend:8080; }
#       location /    { proxy_pass http://{{proxyTarget}}; }

server {
    listen 443 ssl http2;
    server_name {{hostname}};

    ssl_certificate     {{certPath}};
    ssl_certificate_key {{keyPath}};
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS is NOT set by default. Adding it locks browsers into HTTPS for
    # this hostname for a year, which prevents the clean HTTP-first
    # onboarding autohost relies on. To enable HSTS (only after your TLS
    # setup is stable), uncomment:
    #   add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ACME challenge serving for cert renewal. Required — without it,
    # certs will fail to renew after 90 days.
    location /.well-known/acme-challenge/ {
        root {{acmeChallengesRoot}};
        default_type text/plain;
    }

    # Proxy everything else to the Safebox application backend.
    # Edit freely.
    location / {
        proxy_pass         http://{{proxyTarget}};
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_set_header   Connection "";
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }
}

# HTTP → HTTPS redirect for this host. ACME challenges still served via the
# shared dir for renewal validation.
server {
    listen 80;
    server_name {{hostname}};

    location /.well-known/acme-challenge/ {
        root {{acmeChallengesRoot}};
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
