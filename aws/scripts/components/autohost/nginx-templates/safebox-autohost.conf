# /etc/nginx/conf.d/safebox-autohost.conf
#
# Static nginx config that wires autohost into nginx on a Safebox instance.
# Installed once by install-autohost.sh; per-host vhosts written by autohost
# get included at the bottom via wildcard.
#
# What this does:
#
# 1. Shared ACME HTTP-01 challenge endpoint on port 80 for ALL hosts. Lets
#    Let's Encrypt validate any incoming hostname against the shared
#    /var/lib/safebox/autohost/.well-known/acme-challenge/ directory.
#
# 2. HTTP catch-all (port 80, unknown hosts): serves the static splash
#    directly. No TLS, no warning. This is THE design surface: a customer's
#    first visit to a freshly-DNS-pointed hostname lands here. Fires the
#    autohost trigger via nginx's `mirror` directive in the background.
#
# 3. HTTPS catch-all (port 443, unknown hosts): minimal fallback. Serves
#    a short "use HTTP for setup" message with a self-signed bootstrap cert.
#    Browser warns; user can click through or just retry over HTTP. In
#    practice most users never see this — they hit HTTP first.
#
# 4. Per-host vhosts live in /etc/nginx/conf.d/auto/<host>.conf and are
#    included at the bottom of this file via wildcard.
#
# HSTS is NOT set anywhere here. The default per-host vhost template also
# doesn't set HSTS. This is deliberate: HSTS on a never-provisioned hostname
# would poison browser state and prevent clean HTTP-first onboarding.
# Operators who want HSTS can add it to their custom vhost template at
# /etc/safebox/autohost-vhost-template.conf after TLS is stable.

# ── Shared ACME challenge endpoint (port 80, all hosts) ──────────────────────
# Must come BEFORE the catch-all default_server below so it wins for the
# /.well-known/acme-challenge/ path on otherwise-unknown hosts.
server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ {
        root /var/lib/safebox/autohost;
        default_type text/plain;
        try_files $uri =404;
    }
}

# ── Internal trigger location (shared between both catch-alls below) ─────────
# Defined as a fragment that's reused via the `mirror` directive. The
# `internal` keyword means this location is only reachable as a subrequest,
# not directly from external traffic.
#
# We define this inside each catch-all server block because nginx doesn't
# allow internal location to be defined at http{} level. Repeated below.

# ── HTTP catch-all (port 80, unknown hosts) ──────────────────────────────────
# Serves the splash directly over HTTP. No TLS warning. Triggers provisioning
# via mirror. On refresh after provisioning, the per-host vhost takes over.
server {
    listen 80 default_server;
    server_name _;

    # Fire-and-forget provisioning trigger via Unix socket. The mirror
    # subrequest is dispatched in parallel to the main response; we don't
    # wait on its result.
    location = /__autohost {
        internal;
        proxy_pass http://unix:/run/safebox/autohost.sock:/provision;
        proxy_method POST;
        proxy_set_header Content-Type application/json;
        proxy_set_body '{"host":"$host","requestIp":"$remote_addr"}';
        proxy_read_timeout 60s;
        proxy_pass_request_body off;
    }

    # ACME challenges (in case the per-host vhost is being provisioned right
    # now and Let's Encrypt is validating against this catch-all)
    location /.well-known/acme-challenge/ {
        root /var/lib/safebox/autohost;
        default_type text/plain;
        try_files $uri =404;
    }

    # Serve the splash for everything else
    location / {
        mirror /__autohost;
        mirror_request_body off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        default_type text/html;
        alias /etc/safebox/autohost-splash.html;
        try_files /etc/safebox/autohost-splash.html =404;
    }
}

# ── HTTPS catch-all (port 443, unknown hosts) ────────────────────────────────
# Minimal fallback. Self-signed bootstrap cert. Browser warns; user who clicks
# through sees a short "use HTTP for setup" message. The HTTP catch-all above
# is the real design surface — this exists only so port-443 traffic doesn't
# fail with a TLS handshake error for confused users typing https:// manually.
# Still fires the provisioning trigger so things move forward regardless.
server {
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/safebox/autohost-bootstrap.crt;
    ssl_certificate_key /etc/safebox/autohost-bootstrap.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location = /__autohost {
        internal;
        proxy_pass http://unix:/run/safebox/autohost.sock:/provision;
        proxy_method POST;
        proxy_set_header Content-Type application/json;
        proxy_set_body '{"host":"$host","requestIp":"$remote_addr"}';
        proxy_read_timeout 60s;
        proxy_pass_request_body off;
    }

    location / {
        mirror /__autohost;
        mirror_request_body off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        default_type text/html;
        alias /etc/safebox/autohost-splash-https.html;
        try_files /etc/safebox/autohost-splash-https.html /etc/safebox/autohost-splash.html =404;
    }
}

# ── Per-host vhosts (autohost-managed) ──────────────────────────────────────
# These get written by autohost.js to /etc/nginx/conf.d/auto/<host>.conf
# during provisioning, then picked up by nginx -s reload.
include /etc/nginx/conf.d/auto/*.conf;
