; supervisord.conf — vLLM Safebox runner
;
; Two processes:
;   1. vllm-server  — vLLM's OpenAI-compatible HTTP server on 127.0.0.1:8000
;   2. wrapper      — the Safebox protocol adapter on the Unix socket
;
; The wrapper depends on vLLM but starts in parallel; runner.py probes vLLM
; in the background and returns 503 from /v1/chat etc. until vLLM is ready.

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:vllm-server]
command=/bin/bash -c "exec $VLLM_CMDLINE"
autostart=true
autorestart=true
startsecs=10
startretries=3
priority=10
stdout_logfile=/var/log/vllm.out.log
stderr_logfile=/var/log/vllm.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stopwaitsecs=30
stopasgroup=true
killasgroup=true

[program:wrapper]
command=/usr/local/bin/python /app/runner.py
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=20
stdout_logfile=/var/log/wrapper.out.log
stderr_logfile=/var/log/wrapper.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
user=safebox-services
stopwaitsecs=10
environment=MODEL_NAME="%(ENV_MODEL_NAME)s",VLLM_MODEL_ARG="%(ENV_VLLM_MODEL_ARG)s",CAP_CHAT="%(ENV_CAP_CHAT)s",CAP_COMPLETE="%(ENV_CAP_COMPLETE)s",CAP_EMBED="%(ENV_CAP_EMBED)s",CAP_TOOL_USE="%(ENV_CAP_TOOL_USE)s",CAP_VISION="%(ENV_CAP_VISION)s"
