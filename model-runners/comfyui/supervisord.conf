; supervisord.conf — ComfyUI Safebox runner
;
; Two processes:
;   1. comfyui  — ComfyUI HTTP server on 127.0.0.1:8188 (loads diffusion model)
;   2. wrapper  — Safebox protocol adapter on the Unix socket
;
; The wrapper depends on ComfyUI but starts in parallel; runner.py probes
; ComfyUI's /system_stats and returns 503 from /v1/image/generate until
; ComfyUI signals ready.

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:comfyui]
command=/bin/bash -c "exec $COMFYUI_CMDLINE"
autostart=true
autorestart=true
startsecs=10
startretries=3
priority=10
stdout_logfile=/var/log/comfyui.out.log
stderr_logfile=/var/log/comfyui.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stopwaitsecs=30
stopasgroup=true
killasgroup=true

[program:wrapper]
command=/usr/local/bin/python /app/runner.py
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=20
stdout_logfile=/var/log/wrapper.out.log
stderr_logfile=/var/log/wrapper.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
user=safebox-services
stopwaitsecs=10
environment=MODEL_NAME="%(ENV_MODEL_NAME)s",WORKFLOW_FAMILY="%(ENV_WORKFLOW_FAMILY)s",CHECKPOINT_NAME="%(ENV_CHECKPOINT_NAME)s",UNET_NAME="%(ENV_UNET_NAME)s",VAE_NAME="%(ENV_VAE_NAME)s",CLIP_NAMES="%(ENV_CLIP_NAMES)s",DEFAULT_STEPS="%(ENV_DEFAULT_STEPS)s",DEFAULT_CFG="%(ENV_DEFAULT_CFG)s",DEFAULT_WIDTH="%(ENV_DEFAULT_WIDTH)s",DEFAULT_HEIGHT="%(ENV_DEFAULT_HEIGHT)s",DEFAULT_SAMPLER="%(ENV_DEFAULT_SAMPLER)s",DEFAULT_SCHEDULER="%(ENV_DEFAULT_SCHEDULER)s",CAP_TEXT2IMG="%(ENV_CAP_TEXT2IMG)s",CAP_IMG2IMG="%(ENV_CAP_IMG2IMG)s",CAP_INPAINT="%(ENV_CAP_INPAINT)s",CAP_CONTROLNET="%(ENV_CAP_CONTROLNET)s",CAP_LORA="%(ENV_CAP_LORA)s"
